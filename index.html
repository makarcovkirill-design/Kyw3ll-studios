<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070a10">
<title>Kyw3ll Studio V14</title>
<style>
:root{--bg:#070a10;--p:#0d121b;--p2:#111824;--line:#252e3b;--txt:#f5f7fb;--muted:#8994a6;--pur:#a55cff;--pur2:#6c35d8;--gr:#2ef0a3;--cyan:#55dfff;--red:#ff536e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#070a10;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body:before{content:"";position:fixed;inset:0;z-index:-3;background:
radial-gradient(ellipse at 78% 22%,#762bd522 0,transparent 34%),
radial-gradient(ellipse at 20% 82%,#12dca513 0,transparent 30%),
linear-gradient(180deg,#0b1018,#070a10 65%);pointer-events:none}
body:after{content:"";position:fixed;left:0;right:0;bottom:0;height:180px;z-index:-2;background:
linear-gradient(180deg,transparent,#070a10),
radial-gradient(ellipse at 15% 100%,#7026c72b,transparent 42%),
radial-gradient(ellipse at 88% 100%,#1eeaa21c,transparent 38%);pointer-events:none}
button,input,select,label{font:inherit}button,label{cursor:pointer}button{color:var(--txt);cursor:pointer}
.app{max-width:1500px;margin:auto;padding:7px 7px 35px}
.top{height:70px;border:1px solid var(--line);border-radius:14px;background:#0e131beF;backdrop-filter:blur(16px);display:flex;align-items:center;gap:7px;padding:7px 10px;position:sticky;top:5px;z-index:80;box-shadow:0 10px 40px #0009}
.logo{width:235px;display:flex;align-items:center;gap:9px;font-size:19px;font-weight:900}.logoMark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#dd62ff,#6b32db);display:grid;place-items:center;box-shadow:0 0 22px #a55cff66;font-size:23px}.logo small{display:block;color:#8791a2;font-size:8px;letter-spacing:2px;font-weight:500}
.transport{display:flex;gap:4px}.tb{width:43px;height:43px;border:1px solid var(--line);border-radius:9px;background:#101620}.tb.play{color:var(--gr);border-color:#245a47;background:#10251e;font-size:19px}.tb.rec{color:#ff6079}.time{font-variant-numeric:tabular-nums;color:#4cf0b0;font-size:20px;font-weight:850;min-width:112px;text-align:center}.bpm{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:4px 7px}.bpm input{width:45px;background:transparent;border:0;color:#fff;text-align:center}.topRight{margin-left:auto;display:flex;gap:5px}
.layout{display:grid;grid-template-columns:195px minmax(0,1fr) 285px;gap:7px;margin-top:7px}.bottom{display:grid;grid-template-columns:195px minmax(0,1fr) 285px;gap:7px;margin-top:7px}
.panel{background:linear-gradient(180deg,#10151eF5,#0a0e15F5);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 9px 28px #0007}.title{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:850;display:flex;justify-content:space-between}.body{padding:9px}
.nav{padding:7px;display:grid;gap:3px}.nav button{border:1px solid transparent;background:transparent;text-align:left;border-radius:9px;height:39px;color:#aab3c1}.nav button.active{background:linear-gradient(90deg,#432170,#21152f);border-color:#8050c9;color:#efe5ff;box-shadow:inset 3px 0 var(--pur)}
.browser{margin-top:7px}.search{width:100%;background:#090d13;border:1px solid var(--line);border-radius:8px;color:#fff;padding:9px}.folders{display:grid;gap:3px;margin-top:7px}.folder{padding:7px 6px;border-radius:7px;color:#aab3c1;font-size:12px;display:flex;justify-content:space-between}.folder.active{background:#1d2632;color:#fff;border-left:2px solid var(--gr)}.folder span{color:#697586}.browserList{max-height:230px;overflow:auto;margin-top:6px}.sample{padding:7px;border-radius:7px;font-size:11px;color:#b6bfcc;display:flex;gap:6px;align-items:center}.sample:hover{background:#171e29}.quote{padding:18px 8px 8px;text-align:center;color:#a35cff;font-size:13px;font-style:italic}
.arrange{height:540px}.ruler{height:34px;margin-left:65px;display:flex;overflow:hidden;border-bottom:1px solid var(--line);color:#778396;font-size:10px}.ruler span{min-width:80px;padding-top:11px}.tracks{height:calc(100% - 34px);overflow:auto}.track{height:84px;min-width:1120px;display:flex;border-bottom:1px solid #1d2530;position:relative;background:repeating-linear-gradient(to right,#10151d 0,#10151d 79px,#1b222c 80px)}.track.selected{box-shadow:inset 2px 0 var(--pur)}.trackHead{position:sticky;left:0;z-index:10;width:65px;min-width:65px;background:#111720;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:5px}.num{font-size:16px;font-weight:900}.led{width:8px;height:8px;border-radius:50%;background:var(--pur);box-shadow:0 0 9px var(--pur)}.track:nth-child(2) .led,.track:nth-child(4) .led{background:var(--gr);box-shadow:0 0 9px var(--gr)}.trackBtns{position:absolute;left:8px;top:57px;z-index:12;display:flex;gap:2px}.mini{width:22px;height:20px;min-height:20px;padding:0;border:1px solid #303845;border-radius:5px;background:#151a23;font-size:9px}.clips{position:relative;flex:1}.clip{position:absolute;top:14px;height:55px;border:1px solid #9c60ff;border-radius:8px;background:linear-gradient(180deg,#703bc4,#3d2078);overflow:hidden;touch-action:none;box-shadow:0 0 15px #7e42d422}.clip.green{border-color:#36e8ad;background:linear-gradient(180deg,#1b765e,#10483a)}.clipTitle{font-size:10px;font-weight:800;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wave{height:26px;margin:0 7px;background:repeating-linear-gradient(90deg,#fff9 0 2px,transparent 2px 6px);opacity:.55}
.inspector .field{margin-bottom:9px}.label{font-size:10px;color:#8c97a8;margin-bottom:5px;display:block}.range{width:100%;accent-color:var(--gr)}select{width:100%;background:#0a0e14;border:1px solid var(--line);color:#fff;border-radius:8px;padding:9px}.fx{width:100%;border:1px solid #27303c;background:#111720;border-radius:8px;padding:9px;margin:4px 0;text-align:left;font-size:11px}.fx.on{background:#27183e;border-color:#8d57d0}.toggle{float:right;width:28px;height:16px;border-radius:10px;background:#29313d;position:relative}.toggle:after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;background:#8a94a2;border-radius:50%}.fx.on .toggle{background:#178b68}.fx.on .toggle:after{left:14px;background:#b4ffe5}
.mixer{min-height:245px}.strips{display:flex;gap:5px;padding:7px;overflow:auto}.strip{width:73px;min-width:73px;height:225px;border:1px solid #252d38;background:#0b1017;border-radius:9px;display:flex;flex-direction:column;align-items:center;padding:6px;position:relative}.strip.selected{border-color:#9b5cff;box-shadow:inset 0 0 0 1px #6332a7}.strip b{font-size:11px}.knob{width:29px;height:29px;border:2px solid #3b4450;border-radius:50%;margin:7px;background:conic-gradient(var(--gr) 0 100deg,#252c36 100deg)}.fader{height:105px;width:8px;background:#242c36;border-radius:8px;position:relative;margin:auto}.fader i{position:absolute;left:-5px;bottom:28px;width:18px;height:25px;background:#c8cdd5;border-radius:3px}.strip.selected .fader i{background:var(--pur)}.smeter{position:absolute;right:7px;bottom:38px;height:43px;width:4px;background:#202934;border-radius:4px}.smeter i{position:absolute;bottom:0;width:100%;height:45%;background:var(--gr);border-radius:4px}
.masterBox{padding:9px}.masterWave{height:65px;border:1px solid #2b3240;border-radius:8px;background:linear-gradient(180deg,#1b1730,#0e1219);position:relative}.masterWave:after{content:"";position:absolute;left:7%;right:5%;top:52%;height:2px;background:var(--gr);box-shadow:0 -8px 0 #a55cff66,0 8px 0 #a55cff44;transform:skewY(-5deg)}
.file{position:absolute;width:1px;height:1px;opacity:0}.full{width:100%;display:block;text-align:center}.hint{font-size:10px;color:#758093}.toast{position:fixed;left:50%;bottom:23px;transform:translateX(-50%);background:#151a22;border:1px solid #3a4451;border-radius:10px;padding:10px 14px;opacity:0;transition:.2s;z-index:100;pointer-events:none}.toast.show{opacity:1}
@media(max-width:1000px){.layout,.bottom{grid-template-columns:160px minmax(0,1fr)}.right{display:none}.bottom{grid-template-columns:160px minmax(0,1fr)}.bottom .leftBottom{display:none}}
@media(max-width:650px){.app{padding:4px}.top{height:auto;min-height:61px}.logo{width:auto;font-size:15px}.logoMark{width:35px;height:35px}.transport .tb{width:37px;height:37px}.time{min-width:72px;font-size:15px}.topRight{display:none}.layout,.bottom{grid-template-columns:1fr}.left,.leftBottom{display:none}.arrange{height:470px}.mixer{display:block}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="logo"><div class="logoMark">🍆</div><div>Kyw3ll Studio<small>CREATE · FEEL · FOREVER</small></div></div>
 <div class="transport"><button class="tb" id="rew">|◀</button><button class="tb play" id="play">▶</button><button class="tb" id="stop">■</button><button class="tb rec" id="rec">●</button><button class="tb" id="ff">▶|</button></div>
 <div class="time" id="time">0:00.00</div><div class="bpm"><input id="bpm" value="140" type="number"><small>BPM</small></div>
 <div class="topRight"><button class="tb" id="save">Save</button><button class="tb">⚙</button></div>
</header>

<div class="layout">
<aside class="left">
 <div class="panel"><div class="nav" id="nav">
  <button class="active" data-page="Project">⌂ Project</button><button data-page="Sounds">♫ Sounds</button><button data-page="Presets">✦ Presets</button><button data-page="Effects">⌁ Effects</button><button data-page="Mixing">▥ Mixing</button><button data-page="Mastering">∥ Mastering</button><button data-page="Export">⇩ Export</button>
 </div></div>
 <div class="panel browser"><div class="title">Browser <span>⌕</span></div><div class="body">
  <input class="search" id="search" placeholder="Search sounds…">
  <div class="folders" id="folders"></div>
  <div class="browserList" id="browserList"></div>
  <div class="quote">A SMALL STEP<br>FOR A BIG SOUND<br>— KYW3LL</div>
 </div></div>
</aside>

<main>
 <div class="panel arrange"><div class="ruler" id="ruler"></div><div class="tracks" id="tracks"></div></div>
 <div class="panel mixer"><div class="title">Mixer <span id="mixerHint">TRACK 2</span></div><div class="strips" id="strips"></div></div>
</main>

<aside class="right">
 <div class="panel"><div class="title"><span id="insTitle">Track 2</span><span>✎ ⋮</span></div><div class="body inspector">
  <div class="field"><span class="label">BEAT</span><label class="btn primary full" for="beatInput">♫ IMPORT BEAT</label><input class="file" id="beatInput" type="file" accept=".mp3,.wav,.m4a,.aac,.ogg,.webm,audio/*"></div><div class="field"><span class="label">AUDIO</span><label class="btn full" for="fileInput">＋ IMPORT AUDIO → SELECTED TRACK</label><input class="file" id="fileInput" type="file" multiple accept=".mp3,.wav,.m4a,.aac,.ogg,.webm,audio/*"></div>
  <div class="field"><span class="label">VOLUME <b id="volText" style="float:right">0.0 dB</b></span><input id="vol" class="range" type="range" min="0" max="1.5" step=".01" value="1"></div>
  <div class="field"><span class="label">PAN</span><input id="pan" class="range" type="range" min="-1" max="1" step=".01" value="0"></div>
  <b>Effects</b><div id="fxlist"></div>
  <b style="display:block;margin-top:8px">Preset</b><select id="preset"></select>
  <button class="btn full" id="applyPreset" style="margin-top:6px">Apply preset</button>
 </div></div>
 <div class="panel" style="margin-top:7px"><div class="title">Master <span>×</span></div><div class="masterBox">
  <div class="row"><b>Limiter</b><input id="limiter" type="checkbox" checked style="margin-left:auto"></div>
  <div class="masterWave"></div>
  <select style="margin-top:8px"><option>Modern</option><option>Clean</option><option>Loud</option></select>
 </div></div>
</aside>
</div>
<div class="toast" id="toast"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const FX=["EQ","Compressor","Noise Gate","De-Esser","Reverb","Delay","Chorus","Distortion","Radio","Robot","Phaser","Stereo","Limiter","Saturation"];
const folders=["Drums","Kicks","Snares","Claps","Hi-Hats","Percs","808","Bass","Loops","Melodies","Instruments","Vocals","Samples","FX","One Shots","My Sounds","Favorites"];
const presetDefs={"Vocal Clean":["EQ","Compressor","De-Esser","Limiter"],"Rap Vocal":["EQ","Compressor","De-Esser","Saturation","Limiter"],"Dark Vocal":["EQ","Compressor","Reverb"],"Telephone":["Radio","Compressor","Distortion"],"Space":["EQ","Reverb","Delay","Stereo"],"Robot":["EQ","Robot","Stereo"],"Distorted":["Compressor","Distortion","Saturation","Limiter"],"Beat Clean":["EQ","Compressor","Limiter"],"Wide Beat":["EQ","Compressor","Stereo","Limiter"]};
const mkfx=()=>Object.fromEntries(FX.map(x=>[x,false]));
let tracks=Array.from({length:12},(_,i)=>({name:i===0?"BEAT":"TRACK "+(i+1),kind:i===0?"beat":i<3?"vocal":"audio",vol:1,pan:0,fx:mkfx()}));
let clips=[],selected=1,ctx=null,master=null,sources=[],recorder=null,stream=null,recording=false,folder="Drums";

function toast(t){let e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1600)}
function init(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.connect(ctx.destination)}
async function ready(){init();if(ctx.state!=="running")await ctx.resume()}
function sync(){
 const t=tracks[selected];$("#insTitle").textContent="Track "+(selected+1);$("#mixerHint").textContent="TRACK "+(selected+1);$("#vol").value=t.vol;$("#pan").value=t.pan;$("#volText").textContent=(20*Math.log10(Math.max(.0001,t.vol))).toFixed(1)+" dB";
}
function renderFolders(){
 const f=$("#folders");f.innerHTML="";
 folders.forEach(n=>{let b=document.createElement("div");b.className="folder"+(folder===n?" active":"");b.innerHTML=`<span>📁 ${n}</span><span>›</span>`;b.onclick=()=>{folder=n;renderFolders();renderBrowser();toast(n)};f.appendChild(b)})
}
function renderBrowser(){
 const box=$("#browserList"),q=$("#search").value.toLowerCase();box.innerHTML="";
 const examples={Drums:["Kick 01","Kick 02","Snare 01","Clap 01","Hat Closed","Hat Open"],Kicks:["Kick Deep","Kick Punch","Kick Clean"],Snares:["Snare Tight","Snare Dark"],Claps:["Clap Wide","Clap Dry"],"Hi-Hats":["Hat Closed 01","Hat Open 01","Hat Roll"],Percs:["Perc Shaker","Perc Rim"],"808":["808 Deep","808 Slide","808 Long"],Bass:["Bass Sub","Bass Analog","Bass Pluck"],Loops:["Drum Loop 140","Perc Loop","Groove Loop"],Melodies:["Melody Am","Melody Fm","Keys Loop"],Instruments:["Piano","Pad","Guitar"],Vocals:["Vocal Chop","Vocal Texture"],Samples:["Sample 01","Sample 02"],FX:["Rise","Impact","Downlifter"],"One Shots":["Hit","Reverse","Noise"],"My Sounds":["My Sound 01"],Favorites:["Favorite 01"]};
 (examples[folder]||["Папка пуста — добавь свои файлы"]).filter(x=>x.toLowerCase().includes(q)).forEach(n=>{
  let d=document.createElement("div");d.className="sample";d.innerHTML=`<span>♪</span>${n}<span style="margin-left:auto">＋</span>`;
  d.onclick=()=>{toast("Выбери IMPORT AUDIO и добавь свой файл из этой папки");};
  box.appendChild(d)
 })
}
$("#search").oninput=renderBrowser;
function render(){
 const tbox=$("#tracks");tbox.innerHTML="";
 tracks.forEach((t,i)=>{
  let row=document.createElement("div");row.className="track"+(i===selected?" selected":"");
  let h=document.createElement("div");h.className="trackHead";h.innerHTML=`<div><div class="num">${i+1}</div><div class="led"></div></div>`;
  h.onclick=()=>{selected=i;sync();render()};row.appendChild(h);
  let btns=document.createElement("div");btns.className="trackBtns";
  ["M","S"].forEach(k=>{let b=document.createElement("button");b.className="mini";b.textContent=k;b.onclick=ev=>{ev.stopPropagation();b.classList.toggle("on");toast(`Track ${i+1} ${k==="M"?"Mute":"Solo"} ${b.classList.contains("on")?"ON":"OFF"}`)};btns.appendChild(b)});row.appendChild(btns);
  let area=document.createElement("div");area.className="clips";
  clips.filter(c=>c.track===i).forEach(c=>{
   let e=document.createElement("div");e.className="clip"+(t.kind==="vocal"?" green":"");e.style.left=(c.start*80)+"px";e.style.width=Math.max(105,c.duration*80)+"px";e.innerHTML=`<div class="clipTitle">${c.name}</div><div class="wave"></div>`;
   let sx=0,ss=0;e.onpointerdown=ev=>{e.setPointerCapture(ev.pointerId);sx=ev.clientX;ss=c.start};e.onpointermove=ev=>{if(e.hasPointerCapture(ev.pointerId)){c.start=Math.max(0,ss+(ev.clientX-sx)/80);e.style.left=(c.start*80)+"px"}};e.onpointerup=()=>render();e.ondblclick=()=>{clips=clips.filter(x=>x!==c);render();toast("Клип удалён")};
   area.appendChild(e)
  });row.appendChild(area);tbox.appendChild(row)
 });
 let r=$("#ruler");r.innerHTML="";for(let i=1;i<=70;i++){let s=document.createElement("span");s.textContent=i;r.appendChild(s)}
 let strips=$("#strips");strips.innerHTML="";tracks.forEach((t,i)=>{let d=document.createElement("div");d.className="strip"+(i===selected?" selected":"");d.innerHTML=`<b>${i+1}</b><div class="knob"></div><div class="fader"><i></i></div><div class="smeter"><i></i></div><small>${i===0?"♫":t.kind==="vocal"?"🎤":"•"}</small>`;d.onclick=()=>{selected=i;sync();render()};strips.appendChild(d)});
 sync();renderFX();renderPresets()
}
function renderFX(){let b=$("#fxlist"),t=tracks[selected];b.innerHTML="";FX.slice(0,9).forEach(x=>{let e=document.createElement("button");e.className="fx"+(t.fx[x]?" on":"");e.innerHTML=`${x}<span class="toggle"></span>`;e.onclick=()=>{t.fx[x]=!t.fx[x];renderFX()};b.appendChild(e)})}
function renderPresets(){let s=$("#preset");s.innerHTML="";Object.keys(presetDefs).forEach(n=>{let o=document.createElement("option");o.textContent=n;s.appendChild(o)})}
$("#applyPreset").onclick=()=>{let t=tracks[selected],a=presetDefs[$("#preset").value];t.fx=mkfx();a.forEach(x=>t.fx[x]=true);renderFX();toast($("#preset").value+" → Track "+(selected+1))};
$("#vol").oninput=e=>{tracks[selected].vol=+e.target.value;sync();render()};$("#pan").oninput=e=>tracks[selected].pan=+e.target.value;

async function addFiles(fs,target,replaceBeat=false){
 if(!fs.length)return;await ready();
 for(let f of fs){try{let b=await ctx.decodeAudioData(await f.arrayBuffer());if(replaceBeat)clips=clips.filter(c=>c.track!==0);clips.push({name:f.name,track:target,start:0,duration:b.duration,buffer:b});toast("✓ "+f.name+" → "+(target===0?"BEAT":"Track "+(target+1)))}catch(err){console.error(err);toast("Не удалось открыть "+f.name)}}
 render();
}
$("#beatInput").onchange=async e=>{await addFiles([...e.target.files||[]],0,true);e.target.value=""};
$("#fileInput").onchange=async e=>{await addFiles([...e.target.files||[]],selected,false);e.target.value=""};
$("#play").onclick=async()=>{
 if(!clips.length){toast("Добавь аудио");return}await ready();stop(false);let when=ctx.currentTime+.1;
 clips.forEach(c=>{if(!c.buffer)return;let t=tracks[c.track],g=ctx.createGain(),p=ctx.createStereoPanner();g.gain.value=t.vol;p.pan.value=t.pan;g.connect(p);p.connect(master);let s=ctx.createBufferSource();s.buffer=c.buffer;s.connect(g);s.start(when+c.start);sources.push(s)});toast(sources.length?"▶ ВСЕ ДОРОЖКИ ИГРАЮТ":"Нет готового аудио")
};
function stop(show=true){sources.forEach(s=>{try{s.stop()}catch{}});sources=[];if(show)toast("■ STOP")}
$("#stop").onclick=()=>stop(true);$("#rew").onclick=()=>toast("В начало");$("#ff").onclick=()=>toast("Следующий такт");

$("#rec").onclick=async()=>{
 if(recording){recorder.stop();recording=false;$("#rec").textContent="●";toast("Сохраняю запись…");return}
 await ready();try{
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  recorder=new MediaRecorder(stream);let chunks=[];recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  recorder.onstop=async()=>{let blob=new Blob(chunks,{type:recorder.mimeType||"audio/webm"}),f=new File([blob],"Vocal-"+Date.now()+".webm",{type:blob.type});try{let b=await ctx.decodeAudioData(await f.arrayBuffer());clips.push({name:f.name,track:selected,start:0,duration:b.duration,buffer:b});render();toast("🎤 Запись добавлена на Track "+(selected+1))}catch{toast("Ошибка обработки записи")}stream.getTracks().forEach(x=>x.stop())};
  recorder.start();recording=true;$("#rec").textContent="■";toast("● REC → Track "+(selected+1))
 }catch{toast("Разреши микрофон Safari")}
};
$("#save").onclick=()=>{try{localStorage.setItem("kyw14_meta",JSON.stringify({tracks:tracks.map(t=>({name:t.name,kind:t.kind,vol:t.vol,pan:t.pan,fx:t.fx}))}));toast("Проект сохранён")}catch{toast("Не удалось сохранить")}};
$("#nav").onclick=e=>{let b=e.target.closest("button");if(!b)return;document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");toast(b.dataset.page)};
renderFolders();renderBrowser();render();
</script>
</body>
</html>
