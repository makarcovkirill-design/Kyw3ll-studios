<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b10">
<title>Kyw3ll Studio V13</title>
<style>
:root{--bg:#080b10;--panel:#0e1219;--panel2:#121722;--line:#242b37;--muted:#818b9b;--white:#f7f8fb;--purple:#a45cff;--purple2:#6e36d7;--green:#2ff2a1;--cyan:#55d9ff;--danger:#ff5470}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{color:inherit;cursor:pointer}
.app{min-height:100vh;padding:7px;max-width:1500px;margin:auto;background:
radial-gradient(circle at 76% 25%,#52208a16,transparent 30%),
radial-gradient(circle at 30% 75%,#0bd99b0d,transparent 30%)}
.top{height:72px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(90deg,#10141c,#0b0f15);display:flex;align-items:center;gap:7px;padding:8px 12px;position:sticky;top:5px;z-index:50;box-shadow:0 8px 35px #0008}
.logo{width:230px;display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900}.fruit{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#d45cff,#6d2ce0);box-shadow:0 0 22px #a45cff66;display:grid;place-items:center;font-size:23px}.logo small{display:block;color:#8992a2;font-size:9px;letter-spacing:2px;font-weight:500}
.transport{display:flex;gap:4px}.tb{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:#10151e}.play{color:#32f1a0;background:#13231e;border-color:#245b49;font-size:20px}.time{font-variant-numeric:tabular-nums;font-size:22px;font-weight:800;color:#4ff0b3;min-width:125px;text-align:center}.bpm{display:flex;align-items:center;gap:4px;border:1px solid var(--line);padding:4px 8px;border-radius:10px}.bpm input{width:48px;background:transparent;border:0;color:#fff;text-align:center}
.topSpacer{margin-left:auto;display:flex;gap:6px}.icon{font-size:18px}
.layout{display:grid;grid-template-columns:190px minmax(0,1fr) 280px;gap:7px;margin-top:7px}
.panel{background:linear-gradient(180deg,#0f141c,#0b0f15);border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:0 8px 25px #0005}.panelTitle{padding:11px 12px;font-weight:850;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.panelBody{padding:9px}
.nav{display:grid;gap:4px;padding:8px}.nav button{height:40px;border:1px solid transparent;border-radius:9px;background:transparent;text-align:left;color:#aeb6c4}.nav button.active{background:linear-gradient(90deg,#422071,#20152f);border-color:#8d54e6;color:#e9dcff;box-shadow:inset 3px 0 var(--purple)}
.browser{margin-top:7px}.search{width:100%;background:#0a0e14;border:1px solid var(--line);color:#fff;border-radius:8px;padding:9px}.folders{display:grid;gap:4px;margin-top:7px;color:#aeb6c4;font-size:12px}.folder{padding:6px;border-radius:7px}.folder:hover{background:#171c25}.quote{margin-top:20px;padding:10px;color:#a65eff;font-size:14px;font-style:italic;text-align:center}
.center{min-width:0}.arrange{height:535px}.ruler{height:34px;margin-left:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;overflow:hidden;color:#8791a1;font-size:10px}.ruler span{min-width:80px;text-align:left}.tracks{height:calc(100% - 34px);overflow:auto}.track{height:88px;min-width:1100px;display:flex;border-bottom:1px solid #202630;position:relative;background:repeating-linear-gradient(to right,#10151d 0,#10151d 79px,#1c232e 80px)}
.trackHead{position:sticky;left:0;z-index:10;width:70px;min-width:70px;background:#11161f;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.num{font-weight:900;font-size:16px}.dot{width:9px;height:9px;border-radius:50%;background:var(--purple);box-shadow:0 0 9px var(--purple)}.track.selected .trackHead{background:#24163a}.track:nth-child(2) .dot,.track:nth-child(4) .dot{background:var(--green);box-shadow:0 0 9px var(--green)}
.clips{position:relative;flex:1}.clip{position:absolute;top:17px;height:54px;border:1px solid #9b62ff;background:linear-gradient(180deg,#6c35bd,#3c2075);border-radius:8px;overflow:hidden;touch-action:none;box-shadow:0 0 13px #7c42e322}.clip.green{border-color:#39e7ae;background:linear-gradient(180deg,#176f58,#104739)}.clipTitle{font-size:10px;font-weight:750;padding:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wave{height:26px;margin:0 7px;background:repeating-linear-gradient(90deg,#fff9 0 2px,transparent 2px 6px);opacity:.55}
.inspector{display:grid;gap:7px}.field{margin-bottom:8px}.field label{font-size:10px;color:#8e98a8;display:block;margin-bottom:5px}.range{width:100%;accent-color:var(--green)}select,.textinput{width:100%;background:#0a0e14;border:1px solid var(--line);color:#fff;border-radius:8px;padding:9px}
.fx{display:flex;align-items:center;gap:7px;padding:9px;border:1px solid #252d38;border-radius:8px;background:#11161e;margin:4px 0}.fx i{width:20px;color:var(--purple);font-style:normal}.fx.on{border-color:#7650aa;background:#241838}.toggle{margin-left:auto;width:30px;height:17px;border-radius:20px;background:#29303a;position:relative}.toggle:after{content:"";position:absolute;width:13px;height:13px;top:2px;left:2px;background:#8c95a4;border-radius:50%}.fx.on .toggle{background:#1c9b71}.fx.on .toggle:after{left:15px;background:#a9ffe1}
.bottom{display:grid;grid-template-columns:190px minmax(0,1fr) 280px;gap:7px;margin-top:7px}.mixer{min-width:0}.strips{display:flex;gap:5px;overflow-x:auto;padding:7px}.strip{min-width:74px;width:74px;height:225px;border:1px solid #242b36;border-radius:9px;background:#0c1118;display:flex;flex-direction:column;align-items:center;padding:6px;position:relative}.strip.selected{border-color:#9a5cff;box-shadow:inset 0 0 0 1px #5d2c9c}.strip b{font-size:11px}.knob{width:30px;height:30px;border:2px solid #3a4350;border-radius:50%;margin:7px;background:conic-gradient(var(--green) 0 90deg,#222a34 90deg 360deg)}.fader{height:105px;width:9px;background:#242b34;border-radius:8px;position:relative;margin:auto}.fader i{position:absolute;left:-4px;bottom:25px;width:17px;height:25px;background:#c9ced7;border-radius:3px}.strip.selected .fader i{background:var(--purple)}.miniMeter{height:42px;width:5px;background:#1f2832;border-radius:5px;position:absolute;right:8px;bottom:35px}.miniMeter i{display:block;position:absolute;bottom:0;width:100%;height:35%;background:var(--green);border-radius:5px}
.master{padding:10px}.masterWave{height:70px;background:linear-gradient(180deg,#18152a,#10131a);border:1px solid #282c38;border-radius:8px;position:relative;overflow:hidden}.masterWave:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#7351a666;box-shadow:0 -9px 0 #7351a633,0 9px 0 #7351a633}.eq{height:80px;position:relative;margin-top:8px;border:1px solid var(--line);border-radius:8px;background:repeating-linear-gradient(0deg,#121822 0,#121822 19px,#1d2530 20px),repeating-linear-gradient(90deg,transparent 0,transparent 39px,#202833 40px)}.curve{position:absolute;left:10%;right:8%;top:45%;height:2px;background:var(--green);transform:rotate(-4deg);box-shadow:0 0 8px #2ff2a188}.save{background:#141a22;border:1px solid var(--line);border-radius:8px;padding:9px;width:100%;margin-top:8px}
.hiddenFile{position:absolute;width:1px;height:1px;opacity:0}.import{width:100%;text-align:center;display:block}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#151a22;border:1px solid #3b4452;border-radius:10px;padding:10px 14px;opacity:0;transition:.2s;z-index:100}.toast.show{opacity:1}
@media(max-width:950px){.layout,.bottom{grid-template-columns:150px minmax(0,1fr)}.right{display:none}.bottom .left{display:none}.logo{width:auto}.logo small{display:none}.arrange{height:470px}}
@media(max-width:650px){.app{padding:4px}.top{height:auto;min-height:62px}.logo{font-size:15px}.fruit{width:34px;height:34px}.time{min-width:90px;font-size:16px}.tb{width:39px;height:39px}.layout{grid-template-columns:1fr}.left{display:none}.arrange{height:430px}.bottom{grid-template-columns:1fr}.mixer{display:block}.grid{min-width:1050px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="logo"><div class="fruit">🍆</div><div>Kyw3ll Studio<small>CREATE · FEEL · FOREVER</small></div></div>
 <div class="transport"><button class="tb" id="prev">|◀</button><button class="tb play" id="play">▶</button><button class="tb" id="stop">■</button><button class="tb" id="rec">●</button><button class="tb">▶|</button></div>
 <div class="time" id="time">0:00.00</div><div class="bpm"><input id="bpm" value="140" type="number"><span>BPM</span></div>
 <div class="topSpacer"><button class="tb">♬</button><button class="tb">◉</button><button class="tb">⚙</button><button class="tb" id="save">Save</button></div>
</header>

<div class="layout">
<aside class="left">
 <div class="panel"><div class="nav">
  <button class="active">⌂ Project</button><button>♫ Sounds</button><button>✦ Presets</button><button>⌁ Effects</button><button>▥ Mixing</button><button>∥ Mastering</button><button>⇩ Export</button>
 </div></div>
 <div class="panel browser"><div class="panelTitle">Browser <span>⌕</span></div><div class="panelBody">
  <input class="search" placeholder="Search sounds…">
  <div class="folders"><div class="folder">📁 Drums</div><div class="folder">📁 808</div><div class="folder">📁 Claps</div><div class="folder">📁 Hi-Hats</div><div class="folder">📁 Kicks</div><div class="folder">📁 Percs</div><div class="folder">📁 Snares</div><div class="folder">📁 Instruments</div><div class="folder">📁 Vocals</div><div class="folder">📁 Melodies</div><div class="folder">📁 Loops</div><div class="folder">📁 FX</div><div class="folder">📁 One Shots</div><div class="folder">📁 My Sounds</div><div class="folder">♥ Favorites</div></div>
  <div class="quote">A SMALL STEP<br>FOR A BIG SOUND<br>— KYW3LL</div>
 </div></div>
</aside>

<main class="center">
 <div class="panel arrange"><div class="ruler" id="ruler"></div><div class="tracks" id="tracks"></div></div>
 <div class="panel mixer"><div class="panelTitle">Mixer <span>＋</span></div><div class="strips" id="strips"></div></div>
</main>

<aside class="right">
 <div class="panel"><div class="panelTitle"><span id="insTitle">Track 2</span><span>✎ ⋮</span></div><div class="panelBody inspector">
  <div class="field"><label>AUDIO</label><label class="import btn primary" for="fileInput">＋ Import Audio</label><input id="fileInput" class="hiddenFile" type="file" multiple accept=".mp3,.wav,.m4a,.aac,.ogg,.webm,audio/*"></div>
  <div class="field"><label>VOLUME <span id="volText" style="float:right">0.0 dB</span></label><input id="vol" class="range" type="range" min="0" max="1.5" step=".01" value="1"></div>
  <div class="field"><label>PAN</label><input class="range" type="range" min="-1" max="1" step=".01" value="0"></div>
  <div><b>Effects</b> <span style="float:right">＋</span></div><div id="fxlist"></div>
  <div><b>Presets</b></div><select id="preset"></select><button class="save" id="savePreset">＋ Save preset</button>
 </div></div>
 <div class="panel" style="margin-top:7px"><div class="panelTitle">Master <span>×</span></div><div class="master">
  <div class="row"><b>Limiter</b><input id="masterLimit" type="checkbox" checked style="margin-left:auto"></div>
  <div class="masterWave"></div><div class="eq"><div class="curve"></div></div>
  <select id="masterPreset" style="margin-top:8px"><option>Modern</option><option>Clean</option><option>Loud</option></select>
 </div></div>
</aside>
</div>
<div class="toast" id="toast"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const FX=["EQ","Compressor","Noise Gate","De-Esser","Reverb","Delay","Chorus","Distortion","Radio","Robot","Phaser","Stereo","Limiter","Saturation"];
const presetDefs={
"Vocal Clean":["EQ","Compressor","De-Esser","Limiter"],
"Rap Vocal":["EQ","Compressor","De-Esser","Saturation","Limiter"],
"Dark Vocal":["EQ","Compressor","Reverb"],
"Telephone":["Radio","Compressor","Distortion"],
"Space":["EQ","Reverb","Delay","Stereo"],
"Robot":["EQ","Robot","Stereo"],
"Distorted":["Compressor","Distortion","Saturation","Limiter"],
"Beat Clean":["EQ","Compressor","Limiter"],
"Wide Beat":["EQ","Compressor","Stereo","Limiter"]
};
function fxObj(){let o={};FX.forEach(x=>o[x]=false);return o}
let tracks=[
{name:"BEAT",kind:"beat",vol:1,fx:fxObj()},
{name:"TRACK 2",kind:"vocal",vol:1,fx:fxObj()},
{name:"TRACK 3",kind:"vocal",vol:1,fx:fxObj()},
{name:"TRACK 4",kind:"audio",vol:1,fx:fxObj()},
{name:"TRACK 5",kind:"audio",vol:1,fx:fxObj()},
{name:"TRACK 6",kind:"audio",vol:1,fx:fxObj()},
{name:"TRACK 7",kind:"audio",vol:1,fx:fxObj()},
{name:"TRACK 8",kind:"audio",vol:1,fx:fxObj()}
];
let clips=[], selected=1, ctx=null, master=null, sources=[], recording=false, recorder=null, stream=null;

function toast(t){let e=$("#toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1500)}
function init(){if(ctx)return;ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=1;master.connect(ctx.destination)}
async function ready(){init();if(ctx.state!=="running")await ctx.resume()}

function render(){
 const tr=$("#tracks");tr.innerHTML="";
 tracks.forEach((t,i)=>{
  let row=document.createElement("div");row.className="track"+(i===selected?" selected":"");
  let h=document.createElement("div");h.className="trackHead";h.innerHTML=`<div class="num">${i+1}</div><div class="dot"></div>`;
  h.onclick=()=>{selected=i;sync();render()};row.appendChild(h);
  let area=document.createElement("div");area.className="clips";
  clips.filter(c=>c.track===i).forEach(c=>{
   let el=document.createElement("div");el.className="clip "+(t.kind==="vocal"?"green":"");el.style.left=(c.start*80)+"px";el.style.width=Math.max(105,c.duration*80)+"px";
   el.innerHTML=`<div class="clipTitle">${c.name}</div><div class="wave"></div>`;
   let sx=0,ss=0;
   el.onpointerdown=e=>{el.setPointerCapture(e.pointerId);sx=e.clientX;ss=c.start};
   el.onpointermove=e=>{if(!el.hasPointerCapture(e.pointerId))return;c.start=Math.max(0,ss+(e.clientX-sx)/80);el.style.left=(c.start*80)+"px"};
   el.onpointerup=()=>render();
   el.ondblclick=()=>{clips=clips.filter(x=>x.id!==c.id);render();toast("Клип удалён")};
   area.appendChild(el);
  });
  row.appendChild(area);tr.appendChild(row);
 });
 let r=$("#ruler");r.innerHTML="";for(let i=1;i<=70;i++){let s=document.createElement("span");s.textContent=i;r.appendChild(s)}
 let st=$("#strips");st.innerHTML="";
 tracks.forEach((t,i)=>{let d=document.createElement("div");d.className="strip"+(i===selected?" selected":"");d.innerHTML=`<b>${i+1}</b><div class="knob"></div><div class="fader"><i></i></div><div class="miniMeter"><i></i></div><small>${i===0?"♫":i===1?"🎤":"•"}</small>`;d.onclick=()=>{selected=i;sync();render()};st.appendChild(d)});
 sync();renderFX();renderPresets();
}
function sync(){
 let t=tracks[selected];$("#insTitle").textContent=`Track ${selected+1}`;$("#vol").value=t.vol;$("#volText").textContent=(20*Math.log10(Math.max(.0001,t.vol))).toFixed(1)+" dB";
}
function renderFX(){
 let box=$("#fxlist"),t=tracks[selected];box.innerHTML="";
 FX.slice(0,8).forEach(x=>{let b=document.createElement("button");b.className="fx"+(t.fx[x]?" on":"");b.style.width="100%";b.innerHTML=`<i>◉</i>${x}<span class="toggle"></span>`;b.onclick=()=>{t.fx[x]=!t.fx[x];renderFX()};box.appendChild(b)})
}
function renderPresets(){
 let s=$("#preset");s.innerHTML="";Object.keys(presetDefs).forEach(n=>{let o=document.createElement("option");o.textContent=n;s.appendChild(o)})
}
$("#preset").onchange=()=>{let t=tracks[selected],arr=presetDefs[$("#preset").value];t.fx=fxObj();arr.forEach(x=>t.fx[x]=true);renderFX();toast($("#preset").value+" → Track "+(selected+1))};
$("#savePreset").onclick=()=>toast("Пресет сохранён для этой дорожки");
$("#vol").oninput=e=>{tracks[selected].vol=+e.target.value;sync();render()};
$("#fileInput").onchange=async e=>{
 let fs=[...e.target.files||[]];if(!fs.length)return;await ready();
 for(let f of fs){
  try{let buf=await ctx.decodeAudioData(await f.arrayBuffer());clips.push({name:f.name,track:selected,start:0,duration:buf.duration,buffer:buf});toast("✓ "+f.name+" → Track "+(selected+1))}
  catch(err){console.error(err);toast("Не удалось декодировать "+f.name)}
 }
 render();e.target.value="";
};
$("#play").onclick=async()=>{
 if(!clips.length){toast("Сначала импортируй аудио");return}
 await ready();stop(false);
 let when=ctx.currentTime+.08;
 for(let c of clips){if(!c.buffer)continue;let t=tracks[c.track],g=ctx.createGain();g.gain.value=t.vol;g.connect(master);let s=ctx.createBufferSource();s.buffer=c.buffer;s.connect(g);s.start(when+c.start);sources.push(s)}
 toast(sources.length?"▶ Все дорожки играют":"Нет готового аудио");
};
function stop(show=true){sources.forEach(s=>{try{s.stop()}catch{}});sources=[];if(show)toast("■ Stop")}
$("#stop").onclick=()=>stop(true);
$("#rec").onclick=async()=>{
 if(recording){recorder.stop();recording=false;$("#rec").textContent="●";toast("Сохраняю…");return}
 await ready();
 try{
  stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  recorder=new MediaRecorder(stream);let chunks=[];recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  recorder.onstop=async()=>{let b=new Blob(chunks,{type:recorder.mimeType||"audio/webm"}),f=new File([b],"Vocal-"+Date.now()+".webm",{type:b.type});
   try{let buf=await ctx.decodeAudioData(await f.arrayBuffer());clips.push({name:f.name,track:selected,start:0,duration:buf.duration,buffer:buf});render();toast("🎤 Запись добавлена")}catch{toast("Ошибка записи")}
   stream.getTracks().forEach(x=>x.stop())
  };recorder.start();recording=true;$("#rec").textContent="■";toast("● REC → Track "+(selected+1))
 }catch{toast("Разреши микрофон Safari")}
};
$("#save").onclick=()=>{localStorage.setItem("kyw13","saved");toast("Проект сохранён")};
render();
</script>
</body></html>
